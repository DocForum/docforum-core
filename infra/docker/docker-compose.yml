# Local dev stack (not a production deployment recipe). See ARCHITECTURE.md §8.
#
# Usage:
#   docker compose -f infra/docker/docker-compose.yml up --build -d
#   docker compose -f infra/docker/docker-compose.yml ps   # `migrate` should show "Exited (0)"
#
# `migrate` is a one-shot service: it runs `prisma migrate deploy` once and
# exits, and `backend` starts only after it has exited successfully and
# Postgres reports healthy. This auto-migration is deliberately local-only —
# the production image's CMD is still `node dist/server.js` with no entrypoint
# flag, so a replicated deploy never runs migrations from every replica.
#
# Endpoints:
#   GET http://localhost:4000/health/live
#   GET http://localhost:4000/health
#   GET http://localhost:4000/specialties
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: docforum
      POSTGRES_PASSWORD: docforum
      POSTGRES_DB: docforum_dev
    ports:
      - '5432:5432'
    volumes:
      - docforum_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docforum -d docforum_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending migrations once, then exits 0. Built from the `build`
  # stage because the Prisma CLI is a devDependency and is not copied into
  # the runtime image (the app itself talks to Postgres through the driver
  # adapter, not the CLI).
  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: build
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://docforum:docforum@postgres:5432/docforum_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://docforum:docforum@127.0.0.1:5432/docforum_dev
      PORT: '4000'
      JWT_ACCESS_SECRET: dev-jwt-access-secret
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret
      SEP10_SIGNING_SECRET: SC3Z2YBPD7KGXC73CTBNDRGQOIUSAZUH445QIB2PPKWO7CXULRY75JGJ
      SEP10_HOME_DOMAIN: localhost
      SEP10_WEB_AUTH_DOMAIN: localhost
      FIELD_ENCRYPTION_KEY_V1: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      FIELD_ENCRYPTION_ACTIVE_VERSION: v1
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  docforum_postgres_data:
