name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck + test + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Phase 8, issue #47: gate against high/critical advisories in
      # production dependencies (`npm audit --omit=dev --audit-level=high`
      # semantics — see backend/scripts/audit-gate.mjs for the one
      # documented, unfixable-from-here axios chain it tolerates, and why).
      # Deliberately NOT `continue-on-error`: a new vulnerable package must
      # fail this build.
      - name: Audit production dependencies (high+)
        run: npm run audit:prod

      - name: Verify escrow SDK tarball checksum
        run: npm run verify:escrow-sdk

      - run: npm run prisma:generate

      - name: Check message catalogue keys
        run: npm run i18n:check

      - run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Integration tests (self-contained embedded Postgres — the double-booking-guarantee proof)
        run: npm run test:integration

      - run: npm run build

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: github/codeql-action/init@4f3212b61783c3c68e8309a0f18a699764811cda # v3.27.1
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@4f3212b61783c3c68e8309a0f18a699764811cda # v3.27.1
        with:
          category: "/language:javascript-typescript"

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@cb7149a9b57195b609c63e8518d2c610d0f8a3c6 # v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
