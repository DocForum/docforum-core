name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            backend/tools/lint/package-lock.json

      - run: npm ci

      - name: No tracked backup files
        working-directory: .
        run: node scripts/check-no-backup-files.mjs

      - name: ADR numbering (unique and indexed)
        working-directory: .
        run: node scripts/check-adr-numbering.mjs

      - name: ARCHITECTURE section numbering (unique)
        working-directory: .
        run: node scripts/check-section-numbering.mjs

      # typescript-eslint has no TypeScript 7 support yet (TS 7 ships no
      # compiler API), so the linter lives in its own package pinned to the
      # TypeScript 6 compatibility API. See tools/lint/eslint.config.mjs.
      - name: Install lint toolchain
        run: npm ci --prefix tools/lint

      # Phase 8, issue #47: gate against high/critical advisories in
      # production dependencies (`npm audit --omit=dev --audit-level=high`
      # semantics — see backend/scripts/audit-gate.mjs for the one
      # documented, unfixable-from-here axios chain it tolerates, and why).
      # Deliberately NOT `continue-on-error`: a new vulnerable package must
      # fail this build.
      - name: Audit production dependencies (high+)
        run: npm run audit:prod

      - run: npm run prisma:generate

      - name: Check message catalogue keys
        run: npm run i18n:check

      - run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Integration tests (self-contained embedded Postgres — double-booking guarantee + end-to-end care-thread)
        run: npm run test:integration

      # Issue #346. Both suites in one vitest process, so the report is the
      # union of what unit tests and integration tests each reach — a module
      # only exercised over HTTP still shows as covered. The per-module floors
      # are in vitest.config.mts; this step goes red when coverage of a
      # correctness-critical module drops below its recorded level.
      - name: Coverage (unit + integration, merged)
        run: npm run test:coverage

      # The browsable report (html + lcov + json-summary) outlives the run.
      # `run: ` steps use the job's `working-directory: backend`, action steps
      # don't — hence the repo-root path here.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage
          if-no-files-found: error
          retention-days: 14

      # Fails when a schema change has no matching migration (or a migration
      # doesn't produce what the schema declares).
      - name: Migrations reproduce the schema (no drift)
        run: node scripts/check-migration-drift.mjs

      # Prisma schema validation and formatting (issue #342)
      - name: Prisma validate
        run: npm run prisma:validate
      - name: Prisma format check
        run: npm run prisma:format:check

      # Static module-boundary check (issue #340)
      - name: Check module boundaries
        run: node scripts/check-module-boundaries.mjs

      - run: npm run build
