name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            backend/tools/lint/package-lock.json

      - run: npm ci

      - name: No tracked backup files
        working-directory: .
        run: node scripts/check-no-backup-files.mjs

      - name: ADR numbering (unique and indexed)
        working-directory: .
        run: node scripts/check-adr-numbering.mjs

      - name: ARCHITECTURE section numbering (unique)
        working-directory: .
        run: node scripts/check-section-numbering.mjs

      # typescript-eslint has no TypeScript 7 support yet (TS 7 ships no
      # compiler API), so the linter lives in its own package pinned to the
      # TypeScript 6 compatibility API. See tools/lint/eslint.config.mjs.
      - name: Install lint toolchain
        run: npm ci --prefix tools/lint

      # Phase 8, issue #47: gate against high/critical advisories in
      # production dependencies (`npm audit --omit=dev --audit-level=high`
      # semantics — see backend/scripts/audit-gate.mjs for the one
      # documented, unfixable-from-here axios chain it tolerates, and why).
      # Deliberately NOT `continue-on-error`: a new vulnerable package must
      # fail this build.
      - name: Audit production dependencies (high+)
        run: npm run audit:prod

      - run: npm run prisma:generate

      - name: Check message catalogue keys
        run: npm run i18n:check

      - name: Check notification templates for PHI
        run: npm run notifications:check

      - name: Regenerate OpenAPI contract
        run: npm run openapi:generate

      - name: Check OpenAPI contract is committed
        run: git diff --exit-code -- backend/openapi.json

      - run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Integration tests (self-contained embedded Postgres — double-booking guarantee + end-to-end care-thread)
        run: npm run test:integration

      # Fails when a schema change has no matching migration (or a migration
      # doesn't produce what the schema declares).
      - name: Migrations reproduce the schema (no drift)
        run: node scripts/check-migration-drift.mjs

      - run: npm run build
