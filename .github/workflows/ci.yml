name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Phase 8, issue #47: gate against high/critical advisories in
      # production dependencies (`npm audit --omit=dev --audit-level=high`
      # semantics — see backend/scripts/audit-gate.mjs for the one
      # documented, unfixable-from-here axios chain it tolerates, and why).
      # Deliberately NOT `continue-on-error`: a new vulnerable package must
      # fail this build.
      - name: Audit production dependencies (high+)
        run: npm run audit:prod

      - run: npm run prisma:generate

      - name: Check message catalogue keys
        run: npm run i18n:check

      - run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Integration tests (self-contained embedded Postgres — double-booking guarantee + end-to-end care-thread)
        run: npm run test:integration

      - run: npm run build
