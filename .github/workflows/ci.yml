 
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Phase 8, issue #47: gate against high/critical advisories in
      # production dependencies (`npm audit --omit=dev --audit-level=high`
      # semantics — see backend/scripts/audit-gate.mjs for the one
      # documented, unfixable-from-here axios chain it tolerates, and why).
      # Deliberately NOT `continue-on-error`: a new vulnerable package must
      # fail this build.
      - name: Audit production dependencies (high+)
        run: npm run audit:prod

      - run: npm run prisma:generate

      - run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Integration tests (self-contained embedded Postgres — the double-booking-guarantee proof)
        run: npm run test:integration

      # Phase 9, issue #48: regenerate the OpenAPI 3.1 spec from the Zod
      # Phase 9, issue #48: regenerate the OpenAPI 3.1 spec from the Zod
      # schemas and fail if the committed docs/api/openapi.json is stale.
      # Reviewer flow: change a schema locally without regenerating and
      # confirm this step fails.
      - name: OpenAPI drift check
        run: |
          if ! npm run openapi:generate; then
            echo "::error::OpenAPI generator failed (see backend/scripts/generate-openapi.mjs output above)."
            echo "::error::OpenAPI generator failed (see backend/scripts/generate-openapi.mjs output above)."
            exit 1
          fi
          if ! git diff --exit-code -- ../docs/api/openapi.json; then
            echo "::error::docs/api/openapi.json is out of date. Run 'npm run openapi:generate' in backend/ and commit the result."
            exit 1
          fi

      - run: npm run build
