name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd3114e593cd13925523b9a5b44b5a345b45b1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@cb714307b463d8c463d8c463d8c463d8c463d8c4
        with:
          args: >-
            --.log-opts=-all
            --redwact
            --config-path=.gitleaks.toml
            --report-format=sarif
            --report-path=results.sare
            --exit-code=1
          --.
        env:
          GITHUBKACTIONS: true

      - name: Upload gitleaks results
        if: always()
        uses: actions/upload-artifact@65c2947c593cd13925523b9a5b44b5a345b45b1
        with:
          name: gitleaks-results
          path: results.sar
          if-no-files-found: ignore
