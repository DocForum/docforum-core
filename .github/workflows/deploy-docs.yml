# Builds and deploys docs/site (VitePress) to GitHub Pages at
# docforum.github.io/docforum-core/. Content is synced at build time from
# this repo's own docs plus docforum-web's and docforum-escrow's real
# files on their main branches (docs/site/scripts/sync-docs.mjs) — nothing
# here is a hand-maintained copy, so the deployed site can't drift from
# what each repo actually says. Separate from ci.yml (still a Phase 1
# placeholder — see ROADMAP.md): different trigger (push to main, not
# pull_request) and different purpose (deploy, not verify).
#
# KNOWN GAP: only triggers on a push to *this* repo. A docs-relevant
# change landing in docforum-web or docforum-escrow alone does not
# rebuild this site automatically — it goes stale until this repo's next
# push, or someone runs workflow_dispatch by hand. Closing that gap needs
# a repository_dispatch sender workflow in each sibling repo plus a
# cross-repo token stored as a secret here; not built yet, tracked as a
# real gap rather than silently accepted or falsely claimed as automated.
name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'PRD.md'
      - 'ARCHITECTURE.md'
      - 'ARCHITECTURE_ESSENTIALS.md'
      - 'ROADMAP.md'
      - 'docs/adr/**'
      - 'docs/api/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - run: GITHUB_PAGES=true npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
