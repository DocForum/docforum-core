name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd77e5609adb4edb3c35b49c35b49c35b49c35
      - name: Dependency review
        uses: actions/dependency-review-action@5c2c7c5c2c7c5c2c7c5c2c7c5c2c7c5c2c7c5c2
        with:
          fail-on-severity: high
          comment-summary-in-specify-severity: low-or-higher
